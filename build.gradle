plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.0.0'
group = 'com.myrevolvermod.myrevolvermod'

base {
    archivesName = 'myrevolvermod'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)


def generatedResourcesDir = layout.buildDirectory.dir('generated/resources/main')

sourceSets {
    main {
        resources {
            srcDir generatedResourcesDir
        }
    }
}

tasks.register('generateRevolverTexture') {
    def inputFile = file('src/main/resources/assets/myrevolvermod/textures/item/revolver.png.base64')
    def outputFile = generatedResourcesDir.map { it.file('assets/myrevolvermod/textures/item/revolver.png') }

    inputs.file(inputFile)
    outputs.file(outputFile)

    doLast {
        byte[] decoded = java.util.Base64.getDecoder().decode(inputFile.text.trim())
        File out = outputFile.get().asFile
        out.parentFile.mkdirs()
        out.bytes = decoded
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('generateRevolverTexture')
}




tasks.register('importExternalAwpAssets') {
    def generatedBase = generatedResourcesDir.map { it.asFile }

    def awpAnimationExternal = file('awp.animation.json')
    def awpGeoExternal = file('awp.geo.json')
    def awpDisplayExternal = file('awp_display.json')

    inputs.files(awpAnimationExternal, awpGeoExternal, awpDisplayExternal)

    doLast {
        File root = generatedBase.get()

        if (awpAnimationExternal.exists()) {
            File out = new File(root, 'assets/myrevolvermod/animations/awp.animation.json')
            out.parentFile.mkdirs()
            out.text = awpAnimationExternal.text
            println 'Imported external awp.animation.json'
        }

        if (awpGeoExternal.exists()) {
            File out = new File(root, 'assets/myrevolvermod/geo/awp.geo.json')
            out.parentFile.mkdirs()
            out.text = awpGeoExternal.text
            println 'Imported external awp.geo.json'
        }

        if (awpDisplayExternal.exists()) {
            File out = new File(root, 'assets/myrevolvermod/models/item/awp.json')
            out.parentFile.mkdirs()
            out.text = awpDisplayExternal.text
            println 'Imported external awp_display.json'
        }
    }
}

tasks.register('generateAwpTexture') {
    def externalPng = file('awp.png')
    def base64Input = file('src/main/resources/assets/myrevolvermod/textures/item/awp.png.base64')
    def outputFile = generatedResourcesDir.map { it.file('assets/myrevolvermod/textures/item/awp.png') }

    inputs.files(externalPng, base64Input)
    outputs.file(outputFile)

    doLast {
        File out = outputFile.get().asFile
        out.parentFile.mkdirs()

        if (externalPng.exists()) {
            out.bytes = externalPng.bytes
            println 'Imported external awp.png'
        } else {
            byte[] decoded = java.util.Base64.getDecoder().decode(base64Input.text.trim())
            out.bytes = decoded
            println 'Using awp.png.base64 fallback texture'
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('importExternalAwpAssets')
    dependsOn tasks.named('generateAwpTexture')
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                myrevolvermod {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', 'myrevolvermod'
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'myrevolvermod'
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'myrevolvermod',
            'Specification-Vendor'    : 'myrevolvermod',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'myrevolvermod',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
